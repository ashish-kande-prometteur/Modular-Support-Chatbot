version: "3.9"

services:

  postgres:
    image: pgvector/pgvector:pg17
    container_name: chatbot_pgvector
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: chatbot_db

    ports:
      - "5435:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chatbot_db"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - chatbot-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: chatbot_backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/chatbot_db

    ports:
      - "8002:8000"

    volumes:
      - ./static:/app/static
      - ./logs:/app/logs

    networks:
      - chatbot-network

volumes:
  postgres_data:

networks:
  chatbot-network:
